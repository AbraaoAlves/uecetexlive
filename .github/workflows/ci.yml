name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Compliance AGPL: não bloqueia o engine
      # SwiftLaTeX — falha se ele entrar sem LICENSE/licença mista/patches marcados.
      - run: ./scripts/check-agpl-compliance.sh
      - run: bun run build-storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Vendored WASM/template/TeX assets are large and content-stable → cache
      # them keyed by the vendor scripts (bump the key when a script changes).
      - name: Restore vendored assets
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/wasm/busytex
            public/wasm/swiftlatex/texlive
            public/templates/uecetex2
          key: vendor-${{ hashFiles('scripts/vendor-*.sh', 'scripts/sync-texlive-cache.sh') }}

      - name: Vendor assets
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/vendor-uecetex2.sh
          ./scripts/vendor-busytex.sh
          ./scripts/sync-texlive-cache.sh

      - name: Save vendored assets
        if: steps.vendor-cache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            public/wasm/busytex
            public/wasm/swiftlatex/texlive
            public/templates/uecetex2
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Run UI E2E
        id: playwright
        run: bunx playwright test --project=ui
      - uses: actions/upload-artifact@v4
        if: failure() && steps.playwright.outcome == 'failure'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
