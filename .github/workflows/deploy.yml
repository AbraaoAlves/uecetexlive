name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Downloaded (not committed) vendor payloads: busytex binaries + the
      # SwiftLaTeX TeX Live tree. The scripts are idempotent (size-checked),
      # so a cache hit turns them into fast no-ops. Committed files under
      # public/wasm are hashed into the key so a stale cache can never
      # clobber a fresh checkout.
      - uses: actions/cache@v4
        with:
          path: |
            public/wasm/busytex
            public/wasm/swiftlatex/texlive
          key: vendor-${{ hashFiles('scripts/vendor-busytex.sh', 'scripts/sync-texlive-cache.sh', 'public/wasm/busytex/**', 'public/wasm/swiftlatex/*.js', 'public/wasm/swiftlatex/*.wasm') }}
      - run: ./scripts/vendor-uecetex2.sh
      - run: ./scripts/vendor-busytex.sh
      - run: ./scripts/sync-texlive-cache.sh
      # App at the project-page root (abraaoalves.github.io/uecetexlive)…
      # PostHog vars gate a short usage-telemetry window for the TCC (see
      # MY_TCC/entregaveis/fase-5-validacao/plano-integracao-posthog.md);
      # flipping the VITE_TELEMETRY_ENABLED repo variable to "false" and
      # re-running this workflow (workflow_dispatch) turns it off again,
      # no new tag needed.
      - run: bun run build
        env:
          BASE_PATH: /uecetexlive/
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_TELEMETRY_ENABLED: ${{ secrets.VITE_TELEMETRY_ENABLED }}
          VITE_FEEDBACK_FORM_URL: ${{ vars.VITE_FEEDBACK_FORM_URL }}
      # GitHub Pages can't compress the big binaries — publish gzip sidecars
      # that the service worker decompresses client-side (D12).
      - run: ./scripts/precompress-wasm.sh dist/wasm/busytex
      # GitHub Pages has no SPA rewrite: deep links (/sobre) must fall back
      # to the app shell via the 404 page.
      - run: cp dist/index.html dist/404.html
      # …and Storybook alongside it at /uecetexlive/storybook/ (its assets
      # are relative, so it needs no base of its own).
      - run: bunx storybook build -o dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          overwrite: true
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
