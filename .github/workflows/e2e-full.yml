name: E2E Full Compile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/features/compiler/**"
      - "scripts/vendor-*.sh"
      - "scripts/sync-texlive-cache.sh"
      - "e2e/compile-full.spec.ts"
      - "e2e/fixtures/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "bun.lock"
  schedule:
    - cron: "0 6 * * *"

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Vendored WASM/template/TeX assets are large and content-stable → cache
      # them keyed by the vendor scripts (bump the key when a script changes).
      # Same key as ci.yml so the two workflows share the cache entry.
      - name: Restore vendored assets
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/wasm/busytex
            public/wasm/swiftlatex/texlive
            public/templates/uecetex2
          key: vendor-${{ hashFiles('scripts/vendor-*.sh', 'scripts/sync-texlive-cache.sh') }}

      - name: Vendor assets
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/vendor-uecetex2.sh
          ./scripts/vendor-busytex.sh
          ./scripts/sync-texlive-cache.sh

      # Save immediately after a successful download. The monolithic
      # actions/cache post-step was skipped whenever a later E2E assertion
      # failed, forcing every scheduled run to download the assets again.
      - name: Save vendored assets
        if: steps.vendor-cache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            public/wasm/busytex
            public/wasm/swiftlatex/texlive
            public/templates/uecetex2
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Run full-compile E2E
        id: playwright
        run: bunx playwright test --project=full-compile
      - uses: actions/upload-artifact@v4
        if: failure() && steps.playwright.outcome == 'failure'
        with:
          name: playwright-report-full-compile
          path: |
            playwright-report/
            test-results/
