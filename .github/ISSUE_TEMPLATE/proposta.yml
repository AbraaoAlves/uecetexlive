name: Propor uma melhoria
description: Sugerir uma funcionalidade, mudança de comportamento ou melhoria
title: "proposta: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema esta proposta resolve?
      description: Descreva a limitação ou dificuldade atual.
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Solução sugerida
    validations: { required: true }
  - type: dropdown
    id: audience
    attributes:
      label: Público afetado
      multiple: true
      options:
        - Estudante iniciante
        - Estudante/docente da UECE
        - Usuário de abnTeX2
        - Pessoa desenvolvedora
        - Outro (descreva no campo acima)
    validations: { required: false }
