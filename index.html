<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UeceTexLive — edite sua monografia UECE (abnTeX2) e gere o PDF inteiramente no navegador. Seu texto nunca sai do seu computador."
    />
    <title>UeceTexLive</title>

    <!-- Open Graph: so a link shared on WhatsApp/redes shows a
         real preview instead of a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://abraaoalves.me/uecetexlive/" />
    <meta property="og:title" content="UeceTexLive" />
    <meta
      property="og:description"
      content="Edite sua monografia UECE (abnTeX2) e gere o PDF inteiramente no navegador — seu texto nunca sai do seu computador."
    />
    <meta property="og:image" content="https://abraaoalves.me/uecetexlive/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /*
       * First-paint splash (pairs with the existing
       * engine-warmup progress UI in AppShell, which covers the WASM/TeXLive
       * download itself): plain HTML/CSS, zero JS/network dependency, so it
       * renders the instant the HTML parses — never a white screen while the
       * app bundle is still downloading. React's createRoot(#root).render()
       * replaces these children on mount, so nothing has to remove this
       * markup by hand.
       *
       * Colors mirror src/styles.css's :root/.dark tokens — keep in sync.
       * Dark mode here can only key off prefers-color-scheme (no JS has run
       * yet to read the persisted in-app theme choice), so a user who pinned
       * a theme opposite their OS setting sees a brief flash of the OS-toned
       * splash before useTheme() applies the real one on mount.
       */
      #uecetex-splash {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: oklch(0.985 0.005 95);
        color: oklch(0.22 0.02 170);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #uecetex-splash__spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 3px solid oklch(0.55 0.1 150 / 25%);
        border-top-color: oklch(0.55 0.1 150);
        animation: uecetex-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #uecetex-splash {
          background: oklch(0.16 0.01 200);
          color: oklch(0.96 0.01 90);
        }
        #uecetex-splash__spinner {
          border-color: oklch(0.72 0.12 150 / 25%);
          border-top-color: oklch(0.72 0.12 150);
        }
      }
      @keyframes uecetex-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #uecetex-splash__text {
        margin: 0;
        font-size: 0.9rem;
      }
      @media (prefers-reduced-motion: reduce) {
        #uecetex-splash__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="uecetex-splash" role="status" aria-live="polite">
        <div id="uecetex-splash__spinner" aria-hidden="true"></div>
        <p id="uecetex-splash__text">Preparando seu editor…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
